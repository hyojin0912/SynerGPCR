<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Arrowhead (scaled for icon) -->
    <marker id="arr-i" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0.5 L5,3 L0,5.5 z" fill="#94A3B8"/>
    </marker>

    <!-- Blue glow for L4 -->
    <filter id="glow-i" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="blur"/>
      <feFlood flood-color="#3B82F6" flood-opacity="0.72" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── 2×2 hexagon grid (flat-top, r=13, h=11.26)
       N-cascade chain: L1(top-left) → L2(top-right) → L3(bottom-left) → L4(bottom-right)
       Centers: L1(16,16)  L2(48,16)  L3(16,48)  L4(48,48)
       Right vertex of L1 = x=29, Left vertex of L2 = x=35  → 6px gap
       Bottom-right vertex of L2 ≈ (54.5,27.26), Top-left of L3 ≈ (9.5,36.74) → diagonal -->

  <!-- L1 — Binding (muted grey-blue) -->
  <polygon points="29,16 22.5,27.26 9.5,27.26 3,16 9.5,4.74 22.5,4.74"
           fill="#CBD5E1" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="16" y="16" text-anchor="middle" dominant-baseline="central"
        font-family="Inter,system-ui,-apple-system,sans-serif"
        font-size="7.5" font-weight="600" fill="#475569">L1</text>

  <!-- Connector L1 → L2 (horizontal, top row) -->
  <line x1="30" y1="16" x2="34" y2="16"
        stroke="#94A3B8" stroke-width="1.3" marker-end="url(#arr-i)"/>

  <!-- L2 — G-protein Proximal (light blue) -->
  <polygon points="61,16 54.5,27.26 41.5,27.26 35,16 41.5,4.74 54.5,4.74"
           fill="#93C5FD" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="48" y="16" text-anchor="middle" dominant-baseline="central"
        font-family="Inter,system-ui,-apple-system,sans-serif"
        font-size="7.5" font-weight="600" fill="#1D4ED8">L2</text>

  <!-- Connector L2 → L3 (diagonal cascade: bottom-left of L2 → top-right of L3) -->
  <line x1="42.5" y1="26.5" x2="23.5" y2="37.5"
        stroke="#94A3B8" stroke-width="1.3" marker-end="url(#arr-i)"/>

  <!-- L3 — beta-arrestin Biased (medium blue) -->
  <polygon points="29,48 22.5,59.26 9.5,59.26 3,48 9.5,36.74 22.5,36.74"
           fill="#60A5FA" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="16" y="48" text-anchor="middle" dominant-baseline="central"
        font-family="Inter,system-ui,-apple-system,sans-serif"
        font-size="7.5" font-weight="600" fill="white">L3</text>

  <!-- Connector L3 → L4 (horizontal, bottom row) -->
  <line x1="30" y1="48" x2="34" y2="48"
        stroke="#94A3B8" stroke-width="1.3" marker-end="url(#arr-i)"/>

  <!-- L4 — Reporter Distal (brightest blue #3B82F6 + outer glow) -->
  <polygon points="61,48 54.5,59.26 41.5,59.26 35,48 41.5,36.74 54.5,36.74"
           fill="#3B82F6" stroke="#2563EB" stroke-width="2"
           filter="url(#glow-i)"/>
  <text x="48" y="48" text-anchor="middle" dominant-baseline="central"
        font-family="Inter,system-ui,-apple-system,sans-serif"
        font-size="7.5" font-weight="700" fill="white">L4</text>
</svg>
