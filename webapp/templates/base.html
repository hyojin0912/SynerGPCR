<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SynerGPCR{% endblock %}</title>

  <link rel="icon" type="image/x-icon"
        href="{{ url_for('static', path='img/favicon.ico') }}">
  <link rel="icon" type="image/svg+xml"
        href="{{ url_for('static', path='img/favicon.svg') }}">
  <link rel="icon" type="image/png" sizes="32x32"
        href="{{ url_for('static', path='img/favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16"
        href="{{ url_for('static', path='img/favicon-16x16.png') }}">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CDN -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>

  <!-- ── Navbar ──────────────────────────────────────────────────────────── -->
  <nav class="navbar navbar-expand-lg navbar-dark sg-navbar">
    <div class="container">

      <!-- Brand logo -->
      <a class="navbar-brand p-0" href="/">
        <img src="{{ url_for('static', path='img/logo.svg') }}"
             alt="SynerGPCR" height="44" style="display:block;">
      </a>

      <button class="navbar-toggler border-0" type="button"
              data-bs-toggle="collapse" data-bs-target="#navMenu"
              aria-controls="navMenu" aria-expanded="false"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <!-- Nav links -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-3">
          <li class="nav-item">
            <a class="nav-link fw-500 {% if request.url.path == '/' %}nav-active{% endif %}"
               href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-500 {% if request.url.path == '/browse' %}nav-active{% endif %}"
               href="/browse">Browse</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-500 {% if request.url.path == '/ai-prediction' %}nav-active{% endif %}"
               href="/ai-prediction">AI Prediction</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-500 {% if request.url.path == '/download' %}nav-active{% endif %}"
               href="/download">Download</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-500 {% if request.url.path == '/about' %}nav-active{% endif %}"
               href="/about">About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-500 {% if request.url.path == '/help' %}nav-active{% endif %}"
               href="/help">Help</a>
          </li>
        </ul>

        <!-- Global search (navbar) -->
        <div class="position-relative" style="width:300px;">
          <input id="global-search"
                 class="form-control form-control-sm sg-navbar-search"
                 type="search"
                 placeholder="Compound, gene, UniProt AC, disease, or SMILES…"
                 autocomplete="off"
                 aria-label="Search">
          <div id="search-dropdown" class="sg-search-dropdown"></div>
        </div>
      </div>

    </div>
  </nav>

  <!-- ── Hero block (full-width, optional per page) ─────────────────────── -->
  {% block hero %}{% endblock %}

  <!-- ── Main content ───────────────────────────────────────────────────── -->
  <main class="container my-4">
    {% block content %}{% endblock %}
  </main>

  <!-- ── Footer ─────────────────────────────────────────────────────────── -->
  <footer class="sg-footer">
    <small>SynerGPCR — Synergistic Bioinformatics Lab, KAIST | 2026</small>
  </footer>

  <!-- Bootstrap 5 JS bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', path='js/main.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
